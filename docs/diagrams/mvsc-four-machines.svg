<title id="title">Four machines. Four independent players.</title>
<desc id="description">Cross Fever network architecture. P1 hosts on machine 1. P2, P3 and P4 each use a separate machine and controller. P1 and P3 are team A; P2 and P4 are team B. Three two-way UDP connections link the guests to the host. Every machine runs the full game and rollback. Local synchronization has been checked; a real four-machine internet match remains to be tested.</desc>
